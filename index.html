<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shreya Sachan | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Shreya Sachan</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#intro">Intro</a></li>
          <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#papers">Papers</a></li>
          <li class="nav-item"><a class="nav-link" href="#blogs">Blogs</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Intro -->
  <section id="intro" class="container text-center mt-5 pt-5">
    <h1>👋 Hi, I'm <span class="text-primary">Shreya Sachan</span></h1>
    <p class="lead">ML Engineer, IIT Jodhpur (2024 graduate). I will be updating my learnings and projects here.</p>
    <p>📧 <a href="mailto:shreyasachan2002@gmail.com">shreyasachan2002@gmail.com</a></p>
  </section>

  <!-- Projects -->
  <section id="projects" class="container mt-5">
    <h2 class="text-center mb-4">🚀 Projects</h2>
    <div id="projects-list" class="row g-4"></div>
  </section>

  <!-- Papers -->
  <section id="papers" class="container mt-5">
    <h2 class="text-center mb-4">📄 Papers</h2>
    <div id="papers-list" class="row g-4"></div>
  </section>

  <!-- Blogs -->
  <section id="blogs" class="container mt-5">
    <h2 class="text-center mb-4">✍ Blogs</h2>
    <div id="blogs-list" class="accordion"></div>
  </section>

  <script>
    async function loadData() {
      const res = await fetch("data.json");
      const data = await res.json();

      // Projects
      const projectContainer = document.getElementById("projects-list");
      projectContainer.innerHTML = "";
      data.projects.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-4";
        col.innerHTML = `<div class="card p-3 shadow">
          <h5>${p.title}</h5>
          <p>${p.content}</p>
        </div>`;
        projectContainer.appendChild(col);
      });

      // Papers
      const paperContainer = document.getElementById("papers-list");
      paperContainer.innerHTML = "";
      data.papers.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-6";
        col.innerHTML = `<div class="card p-3 shadow">
          <h5>${p.title}</h5>
          <p>${p.content}</p>
        </div>`;
        paperContainer.appendChild(col);
      });

      // Blogs
      const blogContainer = document.getElementById("blogs-list");
      blogContainer.innerHTML = "";
      data.blogs.forEach((b, i) => {
        const item = document.createElement("div");
        item.className = "accordion-item";
        item.innerHTML = `
          <h2 class="accordion-header" id="heading${i}">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${i}">
              ${b.title}
            </button>
          </h2>
          <div id="collapse${i}" class="accordion-collapse collapse">
            <div class="accordion-body">${b.content}</div>
          </div>
        `;
        blogContainer.appendChild(item);
      });
    }

    loadData();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
